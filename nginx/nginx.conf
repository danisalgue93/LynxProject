# ── Upstream pools ─────────────────────────────────────────────────────────────
upstream frontend {
    server frontend:3000;
    keepalive 32;
}

upstream backend {
    server backend:4000;
    keepalive 32;
}

# ── Rate limiting zones ────────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api:10m  rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

# ── HTTP server: Let's Encrypt challenge + redirect ───────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name _;

    # Certbot webroot challenge (used during certificate issuance / renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # All other traffic → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ───────────────────────────────────────────────────────────────
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name _;

    # ── TLS (managed by Certbot / Let's Encrypt) ─────────────────────────────
    ssl_certificate         /etc/nginx/ssl/live/domain/fullchain.pem;
    ssl_certificate_key     /etc/nginx/ssl/live/domain/privkey.pem;
    ssl_trusted_certificate /etc/nginx/ssl/live/domain/chain.pem;

    # Modern TLS settings (Mozilla Intermediate config)
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP Stapling
    ssl_stapling        on;
    ssl_stapling_verify on;
    resolver            1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout    5s;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "DENY"                                          always;
    add_header X-Content-Type-Options     "nosniff"                                       always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"      always;
        # AP-08: connect-src allows wss: (covers WebSocket to any origin, including
    # custom RPC endpoints) and 'self' (covers same-origin API calls). If you use a
    # specific RPC domain that is NOT covered by your frontend's origin, add it here.
    # Do NOT hardcode devnet/mainnet URLs — they change and this header would break.
    add_header Content-Security-Policy    "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # NOTE (AP-08): Update the connect-src domains above to match your actual Solana RPC URL
    # and any other domains the frontend needs to connect to (e.g., your own API domain).

    # ── Request body size limit ──────────────────────────────────────────────
    client_max_body_size 1m;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/wasm
        text/css
        text/plain
        image/svg+xml;

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass             http://backend;
        proxy_http_version     1.1;
        proxy_set_header       Connection     "";   # clear — enables keepalive to upstream
        proxy_set_header       Host           $host;
        proxy_set_header       X-Real-IP      $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;
    }

    # ── Auth endpoints — tighter rate limit ───────────────────────────────────
    location /auth/ {
        limit_req zone=auth burst=5 nodelay;

        proxy_pass             http://backend;
        proxy_http_version     1.1;
        proxy_set_header       Connection     "";
        proxy_set_header       Host           $host;
        proxy_set_header       X-Real-IP      $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     60s;
        proxy_send_timeout     60s;
    }

    # ── WebSocket (Socket.IO) ─────────────────────────────────────────────────
    location /socket.io/ {
        proxy_pass             http://backend;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade        $http_upgrade;
        proxy_set_header       Connection     "upgrade";
        proxy_set_header       Host           $host;
        proxy_set_header       X-Real-IP      $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_read_timeout     3600s;
    }

    # ── MoonPay signed URL proxy ──────────────────────────────────────────────
    location /integrations/ {
        # B-N5: throttle the HMAC-signing onramp endpoint like the rest of the API.
        limit_req zone=api burst=20 nodelay;

        proxy_pass             http://frontend;
        proxy_http_version     1.1;
        proxy_set_header       Connection     "";
        proxy_set_header       Host           $host;
        proxy_set_header       X-Real-IP      $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
    }

    # ── Versioned static assets — immutable 1-year cache ─────────────────────
    location ~* \.(js|css|woff2?|ico|png|svg|webp|avif|wasm)$ {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Connection     "";
        proxy_set_header   Host           $host;
        # B-N2: nginx `add_header` in a location REPLACES all inherited add_headers,
        # so the server-level security headers must be re-declared here or JS/CSS
        # responses would ship without HSTS / nosniff / X-Frame-Options.
        add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options            "DENY"                                          always;
        add_header X-Content-Type-Options     "nosniff"                                       always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"               always;
        add_header Cache-Control  "public, max-age=31536000, immutable";
        expires            1y;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        proxy_pass             http://frontend;
        proxy_http_version     1.1;
        proxy_set_header       Connection     "";
        proxy_set_header       Host           $host;
        proxy_set_header       X-Real-IP      $remote_addr;
        proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
    }
}
