[workspace]
members = [
    "programs/*"
]
resolver = "2"

# ── RESOLVED (2026-07): `anchor build` now emits the IDL ─────────────────────
# This used to be a launch blocker: anchor-syn 0.30.1 (the IDL generator) called
# proc_macro2's `Span::source_file()`, removed in proc-macro2 1.0.85, so
# `anchor build` failed during IDL emission on any modern proc-macro2.
#
# FIXED via option #1 below: the workspace is now on anchor-lang / anchor-spl
# 0.31.1 (see programs/lynx_project/Cargo.toml), whose anchor-syn no longer uses
# source_file(). `anchor build` generates the IDL cleanly, and the `idl-build`
# feature is wired up. `cargo build-sbf` still produces the deployable .so that
# CI builds and the tests execute. (Historical audit note: a stale copy of this
# comment led one external review to re-flag N-1 — it is closed.)

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
