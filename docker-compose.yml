networks:
  lynx:
    driver: bridge

# ── Named volumes ──────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  certbot_www:      # shared between nginx (serve) and certbot (write challenge files)
  certbot_conf:     # shared between nginx (read certs) and certbot (write certs)

# ─────────────────────────────────────────────────────────────────────────────
# SECURITY NOTE — Secrets management:
#   Sensitive env vars (TREASURY_SECRET_KEY, MANAGED_WALLET_SEED, RESEND_API_KEY,
#   ADMIN_API_TOKEN) are currently passed as Docker environment variables.
#   In production, these SHOULD be delivered via Docker Secrets (docker swarm)
#   or an external secrets manager (HashiCorp Vault, AWS Secrets Manager,
#   GCP Secret Manager). The `:?` suffix on required vars ensures the
#   container fails to start if they are missing.
# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # AP-03: Security restrictions for database service (no user/cap_drop to avoid breaking pg_isready)
    security_opt: ["no-new-privileges:true"]
    # Enable TLS for PostgreSQL connections (matches sslmode=require in backend DATABASE_URL).
    # For production, mount real certificates at /var/lib/postgresql/certs/ instead of
    # using the self-signed certs generated here (which are sufficient for
    # encryption-in-transit within a Docker network but lack CA trust).
    command: >
      sh -c "
        if [ ! -f /var/lib/postgresql/certs/server.crt ]; then
          mkdir -p /var/lib/postgresql/certs &&
          openssl req -new -x509 -days 3650 -nodes
            -text -keyout /var/lib/postgresql/certs/server.key
            -out /var/lib/postgresql/certs/server.crt
            -subj '/CN=postgres-internal' 2>/dev/null;
        fi &&
        chmod 600 /var/lib/postgresql/certs/server.key &&
        echo 'ssl = on' >> /var/lib/postgresql/postgresql.conf &&
        echo "ssl_cert_file = '/var/lib/postgresql/certs/server.crt'" >> /var/lib/postgresql/postgresql.conf &&
        echo "ssl_key_file = '/var/lib/postgresql/certs/server.key'" >> /var/lib/postgresql/postgresql.conf &&
        docker-entrypoint.sh postgres
      "
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-lynx_market}
      POSTGRES_USER:     ${POSTGRES_USER:-lynx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [lynx]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lynx} -d ${POSTGRES_DB:-lynx_market}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (distributed rate limiting) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AP-03: Security restrictions for Redis (no user/cap_drop to avoid breaking redis-cli ping)
    security_opt: ["no-new-privileges:true"]
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256m
    networks: [lynx]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prisma migrations (runs once then exits) ──────────────────────────────────
  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: >
      sh -c "sh /scripts/pre-migration-backup.sh && npx prisma migrate deploy && echo 'Migrations applied'"
    volumes:
      - ./scripts:/scripts:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lynx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lynx_market}?schema=public&sslmode=require
    depends_on:
      postgres:
        condition: service_healthy
    networks: [lynx]
    restart: "no"

  # ── Backend ──────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV:             production
      PORT:                 4000
      DATABASE_URL:         postgresql://${POSTGRES_USER:-lynx}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-lynx_market}?schema=public&sslmode=require
      STORE_DRIVER:         prisma
      # No username: redis-server here uses --requirepass (no ACL user), so the
      # single-arg AUTH form (redis://:<pass>@host) is what matches. The old
      # `redis://:${REDIS_USER:-}:${PASS}@` produced a double colon when
      # REDIS_USER was empty, so ioredis sent ":<pass>" and AUTH silently failed,
      # dropping rate limits/locks to per-instance memory (audit A-N1).
      REDIS_URL:            redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      JWT_SECRET:           ${JWT_SECRET:?JWT_SECRET is required}
      REFRESH_SECRET:       ${REFRESH_SECRET:?REFRESH_SECRET is required}
      JWT_EXPIRY:           ${JWT_EXPIRY:-15m}
      REFRESH_EXPIRY:       ${REFRESH_EXPIRY:-7d}
      CORS_ORIGIN:          ${CORS_ORIGIN:?CORS_ORIGIN is required}
      ADMIN_WALLETS:        ${ADMIN_WALLETS:?ADMIN_WALLETS is required}
      TREASURY_WALLET:      ${TREASURY_WALLET:?TREASURY_WALLET is required}
      TREASURY_SECRET_KEY:  ${TREASURY_SECRET_KEY:-/run/secrets/treasury_secret_key}
      MANAGED_WALLET_SEED:  ${MANAGED_WALLET_SEED:-/run/secrets/managed_wallet_seed}
      SOLANA_CLUSTER:       ${SOLANA_CLUSTER:-mainnet-beta}
      SOLANA_RPC_URL:       ${SOLANA_RPC_URL:-https://api.mainnet-beta.solana.com}
      PROGRAM_ID:           ${PROGRAM_ID:-}
      LYNX_MINT:            ${LYNX_MINT:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      RESEND_API_KEY:       ${RESEND_API_KEY:?RESEND_API_KEY is required}
      EMAIL_FROM:           ${EMAIL_FROM:-noreply@lynxmarket.io}
      APP_URL:              ${APP_URL:?APP_URL is required (e.g. https://yourdomain.com)}
      SENTRY_DSN:           ${SENTRY_DSN:-}
    # AP-03: Container security hardening
    user: "lynx"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [lynx]
    secrets:
      - treasury_secret_key
      - managed_wallet_seed
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Frontend ──────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL:                 ${VITE_API_URL:-}
        VITE_SOLANA_NETWORK:          ${SOLANA_CLUSTER:-mainnet-beta}
        VITE_SOLANA_RPC_URL:          ${SOLANA_RPC_URL:-}
        VITE_MAGIC_PUBLISHABLE_KEY:   ${VITE_MAGIC_PUBLISHABLE_KEY:-}
        VITE_MOONPAY_API_KEY:         ${VITE_MOONPAY_API_KEY:-}
        VITE_TREASURY_WALLET:         ${TREASURY_WALLET:-}
        VITE_PROGRAM_ID:              ${PROGRAM_ID:-}
        VITE_LYNX_MINT:               ${LYNX_MINT:-}
        VITE_SENTRY_DSN:              ${VITE_SENTRY_DSN:-}
    restart: unless-stopped
    # AP-03: Container security hardening
    user: "lynx"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID"]
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512m
    environment:
      NODE_ENV:           production
      PORT:               3000
      BACKEND_URL:        http://backend:4000
      CORS_ORIGIN:        ${CORS_ORIGIN:-}
      MOONPAY_SECRET_KEY: ${MOONPAY_SECRET_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    networks: [lynx]

  # ── Nginx reverse proxy ───────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    # AP-03: Container security hardening (nginx runs as root by default for port 80/443)
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE", "CHOWN"]
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_www:/var/www/certbot:ro        # serve ACME challenge files
      - certbot_conf:/etc/nginx/ssl:ro          # serve TLS certificates
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks: [lynx]
    healthcheck:
      test: ["CMD-SHELL", "nginx -t 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── Certbot (Let's Encrypt certificate management) ────────────────────────────
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_www:/var/www/certbot   # write ACME challenge files
      - certbot_conf:/etc/letsencrypt  # write certificates
    # Run in standalone renewal mode. Trigger renewal manually or via a cron job:
    #   docker compose run --rm certbot renew
    # First-time issuance: see nginx/init-certs.sh
    entrypoint: >
      sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    profiles: [certbot]   # only starts when explicitly included: --profile certbot

# ── Docker Secrets (external) ──────────────────────────────────────────────────
# Create with: docker secret create treasury_secret_key /path/to/key
#   and:       docker secret create managed_wallet_seed /path/to/seed
secrets:
  treasury_secret_key:
    external: true
  managed_wallet_seed:
    external: true
